<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Tecnologias Web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Catálogo de Tecnologias Web</h1>

    <input
        type="text"
        id="nome"
        placeholder="Nome da tecnologia"
    >

    <textarea
        id="descricao"
        placeholder="Descrição da tecnologia"
    ></textarea>

    <button id="btnCadastrar">Cadastrar</button>

    <p id="contador">Total: 0 tecnologias cadastradas</p>

    <input
        type="text"
        id="pesquisa"
        placeholder="Pesquisar tecnologia..."
    >

    <div id="lista"></div>

    <script src="script.js"></script>

</body>
</html>
